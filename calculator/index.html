<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=ikkk, initial-scale=1.0">
    <title>Modern Web  Calculator  Design</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>

 <div class="container">
    <div class="calculator">
        <input type="text" placeholder="0">
        <button>AC</button>
        <button>00</button>
        <button>%</button>
        <button class="operator">&divide</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">&times</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>
        <button class="zero">0</button>
        <button class="dot"></button>
        <button>.</button>
        <button class="operator">=</button>
    
    </div>
 </div>

</body>
</html>
